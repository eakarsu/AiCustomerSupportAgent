name: authoritative-contracts
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: app, POSTGRES_PASSWORD: test-password, POSTGRES_DB: customer_support }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d customer_support"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://app:test-password@127.0.0.1:5432/customer_support
      JWT_SECRET: ci-only-secret-that-is-at-least-thirty-two-characters
      SUPPORT_WEBHOOK_SECRET: ci-only-webhook-secret-at-least-thirty-two-characters
      SUPPORT_DATA_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CORS_ORIGINS: http://127.0.0.1:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
        working-directory: backend
      - run: npx prisma generate
        working-directory: backend
      - run: npm test
        working-directory: backend
      - run: npm run migrate
        working-directory: backend
      - run: node --check src/index.js && node --check src/routes/authoritative.js && node --check src/providers/supportProviders.js
        working-directory: backend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: backend
      - name: Launch and readiness smoke test
        working-directory: backend
        run: |
          npm start > /tmp/support-api.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:5001/api/health && exit 0
            sleep 1
          done
          cat /tmp/support-api.log
          exit 1
      - run: npm ci && npm run build
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
